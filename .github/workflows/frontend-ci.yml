name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'infra/docker/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run linter (npm run lint)
        run: npm run lint

      - name: Run unit tests with coverage (npm run test:ci)
        run: npm run test:ci

      - name: SonarCloud Scan & Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build for production (npm run build)
        run: npm run build -- --configuration production

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  e2e-cypress:
    name: Cypress E2E Tests (Catalogue)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start staging infrastructure (docker-compose)
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d
          docker compose -f infra/docker/docker-compose.yml ps

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Run Cypress E2E tests (npm run e2e:ci)
        working-directory: frontend
        run: npm run e2e:ci

      - name: Upload Mochawesome HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-mochawesome-report
          path: frontend/cypress/reports/mochawesome/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop staging infrastructure (docker-compose)
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
