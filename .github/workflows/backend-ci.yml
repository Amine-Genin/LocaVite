name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/maven-settings.xml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/maven-settings.xml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Build and test with Maven (mvn clean verify)
        run: >
          mvn clean verify -B
          -s "$GITHUB_WORKSPACE/.github/maven-settings.xml"
          -Daether.remoteRepositoryFilter.prefixes=false
          -Dmaven.wagon.http.retryHandler.count=3

      - name: SonarCloud Scan & Quality Gate
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.qualitygate.wait=false \
            -B \
            -s "$GITHUB_WORKSPACE/.github/maven-settings.xml" \
            -Daether.remoteRepositoryFilter.prefixes=false

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload backend JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: |
            backend/target/locavite-backend-*.jar
            !backend/target/*.original
          if-no-files-found: error
          retention-days: 7

  security-scans:
    name: PCI-DSS Dependency & Container Scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          # OWASP Dependency-Check scans Maven dependencies below. Excluding
          # manifests avoids Trivy resolving remote registries during outages
          # or rate limiting, while retaining filesystem and secret scanning.
          skip-dirs: backend/target,frontend/node_modules
          skip-files: backend/pom.xml,frontend/package.json,frontend/package-lock.json

      - name: Scan Java dependencies with OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main
        with:
          project: LocaVite backend
          path: backend
          format: HTML
          out: reports
          args: >-
            --failOnCVSS 9
            --enableRetired

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/
          if-no-files-found: warn
          retention-days: 7
