# ==============================================================================
# Configuration du profil DEV (Développement local)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # Par défaut H2 en mode PostgreSQL pour démarrage instantané sans conteneur externe requis.
    # Surchargeable avec SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/locavite pour tester avec Docker.
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:mem:locavitedev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

minio:
  init-bucket: ${MINIO_INIT_BUCKET:false}

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false

logging:
  level:
    ma.locavite: DEBUG
    org.springframework.web: INFO
