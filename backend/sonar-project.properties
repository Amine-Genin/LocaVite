# ==============================================================================
# SonarQube / SonarCloud - Configuration Backend LocaVite (Spring Boot)
# ==============================================================================

# Clés et identification du projet sur SonarCloud
sonar.organization=amine-genin
sonar.projectKey=Amine-Genin_LocaVite-backend
sonar.projectName=LocaVite Backend
sonar.projectVersion=0.1.0-SNAPSHOT
sonar.host.url=https://sonarcloud.io

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Répertoires de sources et de tests
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Intégration du rapport de couverture JaCoCo (généré par mvn clean verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Exclusions de la couverture (configurations, DTOs, entités JPA, mappers générés, classe principale)
sonar.coverage.exclusions=\
  src/main/java/ma/locavite/*Application.java,\
  src/main/java/ma/locavite/**/config/**,\
  src/main/java/ma/locavite/**/dto/**,\
  src/main/java/ma/locavite/**/domain/**,\
  src/main/java/ma/locavite/**/exception/**,\
  src/main/java/ma/locavite/**/mapper/**

# Exclusions générales
sonar.exclusions=\
  **/pom.xml,\
  src/main/resources/**

# Quality Gate : attendre le résultat de l'analyse et échouer le job si la Quality Gate échoue
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

