<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" th:dir="${isRtl ? 'rtl' : 'ltr'}">
<head><meta charset="UTF-8"><title>LocaVite</title></head>
<body>
<div th:if="${#locale.language == 'fr'}"><h2>Paiement confirmé</h2><p>Votre paiement en espèces <strong th:text="${payment.code}">PAY-000</strong> est confirmé. Le reçu PDF est joint à cet email.</p></div>
<div th:if="${#locale.language == 'en'}"><h2>Payment confirmed</h2><p>Your cash payment <strong th:text="${payment.code}">PAY-000</strong> is confirmed. Your PDF receipt is attached.</p></div>
<div th:if="${#locale.language == 'ar'}"><h2>تم تأكيد الدفع</h2><p>تم تأكيد الدفع النقدي <strong th:text="${payment.code}">PAY-000</strong>. الإيصال بصيغة PDF مرفق بهذا البريد.</p></div>
</body></html>
