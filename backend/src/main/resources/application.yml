server:
  port: ${PORT:8081}

spring:
  application:
    name: locavite-backend
  cache:
    type: redis
    redis:
      time-to-live: 1h

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:locavite}
    username: ${DB_USER:locavite}
    password: ${DB_PASSWORD:locavite_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A7134743777217A25432A}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-token:
      expiration: ${JWT_REFRESH_EXPIRATION:604800000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:locavite}
  secret-key: ${MINIO_SECRET_KEY:locavite_dev_password}
  bucket: ${MINIO_BUCKET:locavite-documents}
  init-bucket: ${MINIO_INIT_BUCKET:true}
  vehicles-bucket: ${MINIO_VEHICLES_BUCKET:locavite-vehicles}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
