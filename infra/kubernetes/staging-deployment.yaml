# ==============================================================================
# Manifests Kubernetes / K3s - Environnement Staging LocaVite
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: locavite-staging
  labels:
    app.kubernetes.io/part-of: locavite
    environment: staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locavite-backend
  namespace: locavite-staging
  labels:
    app: locavite-backend
    environment: staging
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: locavite-backend
  template:
    metadata:
      labels:
        app: locavite-backend
        environment: staging
    spec:
      containers:
        - name: backend
          image: ghcr.io/amine-genin/locavite-backend:staging-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
            - name: SPRING_PROFILES_ACTIVE
              value: "staging"
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "locavite_staging"
            - name: REDIS_HOST
              value: "redis-service"
            - name: MINIO_ENDPOINT
              value: "http://minio-service:9000"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: locavite-staging
spec:
  selector:
    app: locavite-backend
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locavite-frontend
  namespace: locavite-staging
  labels:
    app: locavite-frontend
    environment: staging
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: locavite-frontend
  template:
    metadata:
      labels:
        app: locavite-frontend
        environment: staging
    spec:
      containers:
        - name: frontend
          image: ghcr.io/amine-genin/locavite-frontend:staging-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: locavite-staging
spec:
  selector:
    app: locavite-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: locavite-staging-ingress
  namespace: locavite-staging
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: staging.locavite.ma
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8081
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
