# ==============================================================================
# SonarQube Community - Déploiement local auto-hébergé avec PostgreSQL
# ==============================================================================
# Usage :
#   Démarrer SonarQube :
#     docker compose -f infra/docker/docker-compose.sonar.yml up -d
#   Arrêter SonarQube :
#     docker compose -f infra/docker/docker-compose.sonar.yml down
#
# Accès Web :
#   URL        : http://localhost:9000
#   Identifiant: admin
#   Mot de passe initial : admin (à changer lors de la première connexion)
# ==============================================================================

services:
  sonar-db:
    image: postgres:16-alpine
    container_name: locavite-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_dev_password
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - sonar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sonarqube:
    image: sonarqube:10-community
    container_name: locavite-sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_dev_password
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonar-network

volumes:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  sonar-network:
    name: locavite-sonar-network
    driver: bridge

