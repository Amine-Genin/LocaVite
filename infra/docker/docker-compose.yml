# Environnement local de développement : PostgreSQL, Redis et MinIO.
# Les identifiants ci-dessous sont volontairement locaux et ne doivent pas être réutilisés en production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: locavite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: locavite
      POSTGRES_USER: locavite
      POSTGRES_PASSWORD: locavite_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locavite -d locavite"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: locavite-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: 2821568820/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: locavite-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: locavite
      MINIO_ROOT_PASSWORD: locavite_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: locavite-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  # Volumes nommés : les données persistent entre les redémarrages des conteneurs.
  postgres_data:
  redis_data:
  minio_data:
