# ==============================================================================
# Docker Compose pour l'environnement Staging - LocaVite
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: locavite-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-locavite_staging}
      POSTGRES_USER: ${POSTGRES_USER:-locavite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locavite_staging_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    networks:
      - locavite-staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-locavite} -d ${POSTGRES_DB:-locavite_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: locavite-staging-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - staging_redis_data:/data
    networks:
      - locavite-staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: ${MINIO_IMAGE:-2821568820/minio:RELEASE.2024-10-13T13-34-11Z}
    container_name: locavite-staging-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-locavite}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-locavite_staging_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - staging_minio_data:/data
    networks:
      - locavite-staging-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: locavite-staging-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - locavite-staging-network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/amine-genin/locavite-backend:staging-latest}
    container_name: locavite-staging-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 8081
      SPRING_PROFILES_ACTIVE: staging
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-locavite_staging}
      DB_USER: ${POSTGRES_USER:-locavite}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-locavite_staging_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-locavite}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-locavite_staging_password}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A7134743777217A25432A}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    networks:
      - locavite-staging-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/amine-genin/locavite-frontend:staging-latest}
    container_name: locavite-staging-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - locavite-staging-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_minio_data:

networks:
  locavite-staging-network:
    name: locavite-staging-network
    driver: bridge

