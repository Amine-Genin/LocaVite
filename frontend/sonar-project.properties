# ==============================================================================
# SonarQube / SonarCloud - Configuration Frontend LocaVite (Angular 18)
# ==============================================================================

# Clés et identification du projet sur SonarCloud
sonar.organization=amine-genin
sonar.projectKey=Amine-Genin_LocaVite-frontend
sonar.projectName=LocaVite Frontend
sonar.projectVersion=0.1.0
sonar.host.url=https://sonarcloud.io

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Répertoires de sources et de tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts

# Exclusions générales
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  cypress/**,\
  public/**,\
  src/public/**,\
  src/assets/**

# Exclusions de couverture (fichiers de test, point d'entrée, configuration, environnements)
sonar.coverage.exclusions=\
  src/**/*.spec.ts,\
  src/main.ts,\
  src/app/app.config.ts,\
  src/app/app.routes.ts,\
  src/environments/**,\
  public/**,\
  src/public/**,\
  src/assets/**,\
  cypress/**

# Exclusions de duplication pour les fichiers d'environnement, les tests et les assets
sonar.cpd.exclusions=\
  src/environments/**,\
  src/**/*.spec.ts,\
  src/assets/**

# Rapport de couverture LCOV (généré par ng test --code-coverage)
sonar.javascript.lcov.reportPaths=coverage/locavite/lcov.info,coverage/lcov.info

# Quality Gate : attendre le résultat de l'analyse et échouer le job si la Quality Gate échoue
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
