<mat-card class="vehicle-card" data-cy="vehicle-card">
  <div class="media-wrapper">
    <img
      class="vehicle-photo"
      [src]="photoSrc"
      [alt]="vehicle.marque + ' ' + vehicle.modele"
      loading="lazy"
      (error)="onImageError()"
      data-cy="vehicle-photo"
    />

    <span class="category-badge" data-cy="vehicle-category">
      {{ vehicle.categorie }}
    </span>

    <button
      type="button"
      class="favorite-btn"
      [class.active]="favoriteState"
      [attr.aria-pressed]="favoriteState"
      [attr.aria-label]="
        (favoriteState ? 'VEHICLES.REMOVE_FAVORITE' : 'VEHICLES.ADD_FAVORITE') | translate
      "
      (click)="onToggleFavorite($event)"
      data-cy="favorite-btn"
    >
      <svg
        class="heart-icon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        [attr.fill]="favoriteState ? 'currentColor' : 'none'"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
        />
      </svg>
    </button>
  </div>

  <mat-card-content class="card-body">
    <div class="title-row">
      <h3 class="vehicle-title" data-cy="vehicle-title">
        <span class="vehicle-brand" data-cy="vehicle-brand">{{ vehicle.marque }}</span>
        <span class="vehicle-model" data-cy="vehicle-model">{{ vehicle.modele }}</span>
      </h3>
      <span class="vehicle-year" data-cy="vehicle-year">{{ vehicle.annee }}</span>
    </div>

    <div class="meta-row">
      <span class="vehicle-city" data-cy="vehicle-city">
        <svg
          class="pin-icon"
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        {{ vehicle.ville }}
      </span>
    </div>
  </mat-card-content>

  <mat-card-actions class="card-footer">
    <div class="price-block" data-cy="vehicle-price">
      <span class="price-amount">
        {{ vehicle.prixJour }} {{ 'COMMON.CURRENCY_MAD' | translate }}
      </span>
      <span class="price-unit">{{ 'VEHICLES.PER_DAY' | translate }}</span>
    </div>

    <button
      type="button"
      mat-flat-button
      class="details-btn"
      [routerLink]="['/vehicles', vehicle.id]"
      (click)="onDetailsClick()"
      data-cy="details-btn"
    >
      {{ 'VEHICLES.DETAILS' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
